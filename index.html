<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>零时回响 · 时间切换 MVP</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div class="hud">
      <section class="brand">
        <span>ZERO ECHO / MVP 01</span>
        <h1>零时回响</h1>
      </section>
      <section class="era-card">
        <span>当前时间层</span>
        <strong id="era-label">现代</strong>
        <div class="era-track"><i id="era-dot"></i></div>
      </section>
      <section class="objective">
        <span>实验目标</span>
        <p id="objective">按 Q 回到过去，靠近墙体并按 空格 攻击</p>
      </section>
      <section class="controls">
        <kbd>WASD</kbd><span>移动</span>
        <kbd>Q</kbd><span>切换时代</span>
        <kbd>SPACE</kbd><span>攻击</span>
      </section>
      <section class="boss-hud">
        <div><span>BOX / 守门者</span><b id="boss-value">100%</b></div>
        <div class="health"><i id="boss-health"></i></div>
      </section>
    </div>
    <div id="toast" class="toast"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
